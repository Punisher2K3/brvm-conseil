name: Publier et actualiser BRVM Conseil
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      archives:
        description: Inclure le lot quotidien d’archives publiques
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: brvm-publication
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Restaurer les données validées
        run: |
          python gerer_base.py restaurer
          python integrer_archives_brvm.py
      - name: Restaurer le cache des sources
        uses: actions/cache@v4
        with:
          path: collecte
          key: brvm-collecte-${{ github.run_id }}
          restore-keys: brvm-collecte-
      - name: Vérifier la reprise et la fraîcheur
        run: |
          python -m unittest test_pipeline_actualisation.py test_pages_informations.py
          node test_etat_actualisation.cjs
      - name: Collecter avec reprise indépendante des sources
        env:
          BRVM_MODE: ${{ (github.event_name == 'schedule' || inputs.archives == true) && 'full' || 'quick' }}
        run: python pipeline_actualisation.py --mode "$BRVM_MODE"
      - name: Vérifier les données et calculs
        run: |
          python -m unittest test_collecte_historique.py test_collecter_brvm.py test_collecter_sources.py
          node test_fondamentaux.cjs
          node test_previsions.cjs
          node test_previsions_j1.cjs
          node test_signaux.cjs
          node test_recherche.cjs
          node test_sources_brvm.cjs
          node test_journal_previsions.cjs
          node test_valorisations.cjs
          node --check app.js
          node --check fiche_fondamentale.js
      - name: Enregistrer les prévisions avant leur échéance
        run: node evaluer_previsions.cjs
      - name: Construire et contrôler la publication
        run: |
          python preparer_publication.py
          python verifier_publication.py
      - name: Préparer la sauvegarde de données
        run: python pipeline_actualisation.py --sauvegarder
      - name: Conserver une sauvegarde récupérable
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-brvm-${{ github.run_id }}
          path: collecte/sauvegarde-donnees.zip
          retention-days: 30
          if-no-files-found: error
      - name: Enregistrer les données sans écraser une modification concurrente
        run: |
          python gerer_base.py sauvegarder
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "::error::La branche a changé pendant la collecte. La nouvelle exécution reprendra sur la version récente."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualisation-publique.json brvm-officiel.json indices-brvm.json obligations.json base-marche.json.gz catalogue.json finances.js fondamentaux.json fondamentaux.js previsions-journal.json sources-complementaires.json.gz
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser les données officielles BRVM et leur état de collecte"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-public
      - name: Mettre le site en ligne
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Conserver le diagnostic du passage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-brvm-${{ github.run_id }}
          path: |
            actualisation-publique.json
            collecte/actualisation.log
            site-public/status-public.json
          retention-days: 14
          if-no-files-found: ignore
